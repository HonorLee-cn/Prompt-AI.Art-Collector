<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt-AI.ART 收录</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>PROMPT-AI.ART</span>
      </div>
      <div class="top-right">
        <span id="queueBadge" class="badge hidden">0</span>
        <span id="authState" class="muted">检查绑定…</span>
      </div>
    </header>

    <main>
      <section class="card auth-card">
        <div class="row-between">
          <div class="row gap account-title">
            <h2>账号</h2>
            <span id="boundBadge" class="bound-badge hidden"></span>
            <span id="boundNote" class="bound-note hidden">· 收录归属本人。</span>
          </div>
          <button id="toggleSettings" class="link" type="button">设置</button>
        </div>
        <p id="authText" class="muted small">
          绑定 API Key 后收录归属本人；不绑定则匿名提交到待审核。
        </p>

        <div id="settingsPanel" class="settings hidden">
          <label id="keyField"
            >API Key<input
              id="apiKey"
              type="password"
              placeholder="pa_…（留空保留已保存的 Key）"
          /></label>
          <div class="row gap">
            <button id="verifyKey" class="primary" type="button">
              保存并验证
            </button>
          </div>
          <button id="clearKey" class="ghost full unbind hidden" type="button">
            解除绑定
          </button>
          <button id="getApiKey" class="ghost full" type="button">
            获取 API KEY
          </button>
          <p class="muted tiny">
            Key 只保存在本机 chrome.storage.local，不会发送到其他服务。
          </p>
        </div>

        <div id="queueRow" class="row-between hidden">
          <span id="queueText" class="muted tiny"></span>
          <button id="retryQueue" class="link" type="button">重试队列</button>
        </div>
      </section>

      <section id="contextBanner" class="card context-card hidden">
        <p id="contextText" class="small"></p>
        <div class="row gap">
          <button id="useContext" class="primary small-btn" type="button">
            使用右键内容
          </button>
          <button id="dismissContext" class="ghost small-btn" type="button">
            忽略
          </button>
        </div>
      </section>

      <section class="card">
        <div class="row-between">
          <h2>图片</h2>
          <button id="readTab" class="link" type="button">从当前页读取</button>
        </div>
        <div id="imageDrop" class="dropzone">
          <img id="imagePreview" class="preview hidden" alt="预览" />
          <div id="dropHint" class="muted small">
            拖入图片、粘贴截图，或从右键菜单选“收录这张图片”
          </div>
        </div>
        <div class="row gap wrap">
          <button id="pickFile" class="ghost small-btn" type="button">
            选择文件
          </button>
          <input
            id="fileInput"
            class="hidden"
            type="file"
            accept="image/png,image/jpeg,image/webp"
          />
          <input
            id="imageUrl"
            class="url-input"
            type="url"
            placeholder="或粘贴图片链接"
          />
          <button id="fetchUrl" class="ghost small-btn" type="button">
            读取
          </button>
        </div>
        <p id="imageError" class="error small hidden"></p>
      </section>

      <section class="card">
        <h2>收录信息</h2>
        <label>标题<input id="title" type="text" maxlength="200" /></label>
        <label>中文提示词<textarea id="promptZh" rows="3"></textarea></label>
        <label
          >English prompt<textarea id="promptEn" rows="3"></textarea>
        </label>
        <label>反向提示词<input id="negativePrompt" type="text" /></label>
        <div class="field-label">标签</div>
        <div class="tag-picker">
          <div id="selectedTags" class="tag-chips"></div>
          <input id="tagDraft" type="text" placeholder="输入新标签，回车加入" />
          <div class="tag-tools">
            <input id="tagFilter" type="text" placeholder="筛选标签…" />
            <button id="selectAllTags" class="link" type="button">全选</button>
            <button id="invertTags" class="link" type="button">反选</button>
            <button id="clearTags" class="link" type="button">清空</button>
          </div>
          <div id="tagOptions" class="tag-options"></div>
        </div>

        <div class="field-label">NSFW</div>
        <div id="nsfwPicker" class="segmented" role="group" aria-label="NSFW">
          <button type="button" data-level="0">SFW</button>
          <button type="button" data-level="1">Suggestive</button>
          <button type="button" data-level="2">NSFW</button>
        </div>

        <label>来源页面<input id="sourceUrl" type="url" /></label>
        <p id="formError" class="error small hidden"></p>
        <button id="submit" class="primary full" type="button">提交收录</button>
        <p class="muted tiny">草稿自动保存在本机；关闭侧边栏不会丢失。</p>
      </section>

    </main>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="sidepanel.ts"></script>
  </body>
</html>
