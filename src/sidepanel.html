<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="side.title">Prompt-AI.ART 收录</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>PROMPT-AI.ART</span>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="zh" class="active" aria-pressed="true">中</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <div class="top-right">
        <span id="queueBadge" class="badge hidden">0</span>
        <span id="authState" class="muted" data-i18n="side.auth.checking"
          >检查绑定…</span
        >
      </div>
    </header>

    <main>
      <section class="card auth-card">
        <div class="row-between">
          <div class="row gap account-title">
            <h2 data-i18n="side.account">账号</h2>
            <span id="boundBadge" class="bound-badge hidden"></span>
            <span
              id="boundNote"
              class="bound-note hidden"
              data-i18n="side.auth.boundNote"
              >· 收录归属本人。</span
            >
          </div>
          <button
            id="toggleSettings"
            class="link"
            type="button"
            data-i18n="common.settings"
          >
            设置
          </button>
        </div>
        <p id="authText" class="muted small" data-i18n="side.auth.initial">
          绑定 API Key 后收录归属本人；不绑定则匿名提交到待审核。
        </p>

        <div id="settingsPanel" class="settings hidden">
          <label id="keyField"
            ><span data-i18n="side.apiKeyLabel">API Key</span
            ><input
              id="apiKey"
              type="password"
              placeholder="pa_…（留空保留已保存的 Key）"
              data-i18n-placeholder="side.auth.keyPlaceholder"
          /></label>
          <div class="row gap">
            <button
              id="verifyKey"
              class="primary"
              type="button"
              data-i18n="side.verify"
            >
              保存并验证
            </button>
          </div>
          <button
            id="clearKey"
            class="ghost full unbind hidden"
            type="button"
            data-i18n="side.unbind"
          >
            解除绑定
          </button>
          <button
            id="getApiKey"
            class="ghost full"
            type="button"
            data-i18n="side.getKey"
          >
            获取 API KEY
          </button>
          <p class="muted tiny" data-i18n="side.keyHint">
            Key 只保存在本机 chrome.storage.local，不会发送到其他服务。
          </p>
        </div>

        <div id="queueRow" class="row-between hidden">
          <span id="queueText" class="muted tiny"></span>
          <button
            id="retryQueue"
            class="link"
            type="button"
            data-i18n="side.retryQueue"
          >
            重试队列
          </button>
        </div>
      </section>

      <section class="card">
        <div class="row-between">
          <h2 data-i18n="side.imageTitle">图片</h2>
          <button
            id="readTab"
            class="link"
            type="button"
            data-i18n="side.readTab"
          >
            从当前页读取
          </button>
        </div>
        <div
          id="imageDrop"
          class="dropzone"
          role="button"
          tabindex="0"
        >
          <img id="imagePreview" class="preview hidden" alt="预览" />
          <div id="dropHint" class="muted small" data-i18n="side.dropHint">
            拖入图片，或点击选择
          </div>
        </div>
        <input
          id="fileInput"
          class="hidden"
          type="file"
          accept="image/png,image/jpeg,image/webp"
        />
        <p id="imageError" class="error small hidden"></p>
      </section>

      <section class="card">
        <div class="row-between">
          <h2 data-i18n="side.formTitle">收录信息</h2>
          <button
            id="reversePrompt"
            class="link reverse-action"
            type="button"
            data-i18n="side.reverse"
          >
            反推提示词
          </button>
        </div>
        <label
          ><span data-i18n="side.titleLabel">标题</span
          ><input id="title" type="text" maxlength="200"
        /></label>
        <label
          ><span data-i18n="side.promptLabel">提示词</span
          ><textarea
            id="promptText"
            rows="4"
            placeholder="输入提示词…"
            data-i18n-placeholder="side.promptPlaceholder"
          ></textarea>
        </label>
        <div class="field-label" data-i18n="side.tags">标签</div>
        <div class="tag-picker">
          <div id="selectedTags" class="tag-chips"></div>
          <input
            id="tagDraft"
            type="text"
            placeholder="输入新标签，回车加入"
            data-i18n-placeholder="side.tagDraftPlaceholder"
          />
          <div class="tag-tools">
            <input
              id="tagFilter"
              type="text"
              placeholder="筛选标签…"
              data-i18n-placeholder="side.tagFilterPlaceholder"
            />
            <button
              id="selectAllTags"
              class="link"
              type="button"
              data-i18n="side.selectAll"
            >
              全选
            </button>
            <button
              id="invertTags"
              class="link"
              type="button"
              data-i18n="side.invertTags"
            >
              反选
            </button>
            <button
              id="clearTags"
              class="link"
              type="button"
              data-i18n="side.clearTags"
            >
              清空
            </button>
          </div>
          <div id="tagOptions" class="tag-options"></div>
        </div>

        <div class="field-label" data-i18n="side.nsfw">NSFW</div>
        <div id="nsfwPicker" class="segmented" role="group" aria-label="NSFW">
          <button type="button" data-level="0">SFW</button>
          <button type="button" data-level="1">Suggestive</button>
          <button type="button" data-level="2">NSFW</button>
        </div>

        <label
          ><span data-i18n="side.sourceUrl">来源页面</span
          ><input id="sourceUrl" type="url"
        /></label>
        <p id="formError" class="error small hidden"></p>
        <button
          id="submit"
          class="primary full"
          type="button"
          data-i18n="side.submit"
        >
          提交收录
        </button>
        <p class="muted tiny" data-i18n="side.draftHint">
          草稿自动保存在本机；关闭侧边栏不会丢失。
        </p>
      </section>
    </main>

    <div
      id="reverseConfirm"
      class="modal-mask hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="reverseConfirmTitle"
    >
      <div class="modal-card">
        <h2 id="reverseConfirmTitle" data-i18n="side.reverseConfirmTitle">
          确认反推提示词
        </h2>
        <p class="muted small" data-i18n="side.reverseConfirmBody">
          将使用当前图片调用 AI 反推，并自动填入标题、提示词和 NSFW。是否继续？
        </p>
        <div class="row gap modal-actions">
          <button
            id="reverseCancel"
            class="ghost"
            type="button"
            data-i18n="side.reverseCancel"
          >
            取消
          </button>
          <button
            id="reverseStart"
            class="primary"
            type="button"
            data-i18n="side.reverseStart"
          >
            开始反推
          </button>
        </div>
      </div>
    </div>

    <div
      id="reverseProgress"
      class="modal-mask hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="reverseProgressTitle"
    >
      <div class="modal-card reverse-progress">
        <div class="spinner" aria-hidden="true"></div>
        <h2 id="reverseProgressTitle" data-i18n="side.reverseProgressTitle">
          正在反推提示词
        </h2>
        <p id="reverseStatus" class="muted small"></p>
        <button
          id="reverseProgressCancel"
          class="ghost"
          type="button"
          data-i18n="side.reverseCancel"
        >
          取消
        </button>
      </div>
    </div>

    <div
      id="contextModal"
      class="modal-mask hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="contextModalTitle"
    >
      <div class="modal-card">
        <h2 id="contextModalTitle" data-i18n="side.contextTitle">
          发现右键内容
        </h2>
        <p id="contextText" class="small muted"></p>
        <div class="row gap modal-actions">
          <button
            id="useContext"
            class="primary small-btn"
            type="button"
            data-i18n="side.contextUse"
          >
            使用右键内容
          </button>
          <button
            id="dismissContext"
            class="ghost small-btn"
            type="button"
            data-i18n="side.contextDismiss"
          >
            忽略
          </button>
        </div>
      </div>
    </div>

    <div
      id="submitSuccess"
      class="modal-mask hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="submitSuccessTitle"
    >
      <div class="modal-card success-card">
        <button
          id="submitSuccessClose"
          class="success-close"
          type="button"
          aria-label="关闭"
        >
          ×
        </button>
        <div class="success-icon" aria-hidden="true">✓</div>
        <h2 id="submitSuccessTitle" data-i18n="side.successTitle">收录成功</h2>
        <p id="submitSuccessBody"></p>
        <a
          id="submitSuccessLink"
          class="primary full success-link"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="sidepanel.ts"></script>
  </body>
</html>
